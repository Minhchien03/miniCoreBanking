services:
  # Agent sẽ làm việc ở đây
  ai_agency:
    build:
      context: .
      dockerfile: dockerfile.agent
    volumes:
      - .:/app  
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # Hạ tầng bổ trợ cho dự án
# Cơ sở dữ liệu Postgres
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
  
  redis:
    image: redis:alpine